name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  checks: write
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Verify modules
        run: mage modVerify

      - name: Run tests
        run: mage test:run

      - name: Check test coverage
        if: matrix.go-version == '1.25'
        run: mage test:coverage

      - name: Generate HTML coverage report
        if: matrix.go-version == '1.25'
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Test report
        if: always() && matrix.go-version == '1.25' && github.event.pull_request.head.repo.full_name == github.repository
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: junit.xml
          reporter: java-junit

      - name: Upload coverage report
        if: matrix.go-version == '1.25'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build packages
        run: go build -v ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Run OSV-Scanner
        run: mage security:osvScan
